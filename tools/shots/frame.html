<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dungeon shot frame</title>
<!--
  The screenshot frame.

  WHY THIS EXISTS
  Every verification since 2026-08-12 has closed with "no screenshots — the Browser pane
  was not compositing". An undisplayed pane composites no frames, so the pane's own
  screenshot times out saying so. Headless Chrome has no pane to display — but
  `chrome --screenshot` photographs a page as it loads and cannot click, so on its own it
  can only ever capture a landing screen.

  This is the way round it. The frame is same-origin with the app, so it drives the real
  UI inside an iframe exactly as tools/browser-checks/*.js do in the pane, and then holds
  still. Chrome photographs the frame; the frame is the app at the size asked for. It is
  the fixed-width same-origin iframe technique LAW-64 already prescribes for measuring
  layout, used for pictures instead of numbers.

  It ships nothing: `tools/` is outside the build allowlist.

  EVERYTHING WAITS
  The app renders its dashboard after its own boot, and crossing between Learn and the
  examiner runs through `document.startViewTransition`, which is asynchronous. The first
  version of this file drove the UI on the iframe's `load` event and failed on fourteen
  of sixteen scenes with "no subject card reads 'SPMS'" — the cards had not been rendered
  yet. So every step waits for the thing it is about to press.

  URL CONTRACT
    ?scene=<name>&w=<px>&h=<px>&theme=light|dark|system&subject=SPMS|BRGSA|SCLM|IBM
-->
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body.dark { background: #101314; }
  iframe { border: 0; display: block; }
  /* Visible only when a scene throws, and deliberately loud: a blank screenshot and a
     screenshot of a failed drive look identical otherwise. */
  #shot-error {
    position: fixed; inset: 0; z-index: 9999; display: none;
    padding: 24px; font: 16px/1.5 ui-monospace, monospace;
    color: #fff; background: #a3121b; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="shot-error"></div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var scene = params.get("scene") || "dashboard";
  var width = Number(params.get("w") || 1280);
  var height = Number(params.get("h") || 800);
  var theme = params.get("theme") || "system";
  var subject = params.get("subject") || "SPMS";
  var KEY = "term6.revision.v2";

  function fail(message) {
    var box = document.getElementById("shot-error");
    box.style.display = "block";
    box.textContent = "The scene did not complete.\nscene: " + scene + "\n\n" + message;
    /* The driver reads the title, not the body — the body's own explanation of this
       banner used to match the driver's search for it and condemned four good shots. */
    document.title = "shot broken: " + scene;
  }

  /* The app reads its profile from storage once, at load, so anything staged has to be
     written BEFORE the iframe is created — never after. */
  try { localStorage.removeItem(KEY); } catch (error) { /* first run */ }
  if (theme === "dark" || theme === "light") {
    try { localStorage.setItem("term6.appearance", theme); } catch (error) { /* ignore */ }
    if (theme === "dark") document.body.classList.add("dark");
  }

  var frame = document.createElement("iframe");
  frame.width = width;
  frame.height = height;
  /* Exam screenshots start on the exam-home scenario. A view-transition's old frame
     can remain the photographed layer under headless virtual time even after the DOM
     has correctly switched, which produced a green title over a dashboard picture.
     Functional header crossing is tested separately; this frame's job is pixel
     acceptance of the requested destination. */
  var startupScenario = scene === "mini-question" || scene === "mini-result" ? "mini-question"
    : scene === "mini-feedback" ? "mini-feedback"
    : scene === "notes" || scene === "notes-ibm" ? "notes"
    : scene === "exam-question" ? "exam-question"
    : scene === "exam-home" ? "exam-home"
    : scene === "exam-final" ? "exam-final"
    : scene === "exam-full" ? "exam-full"
    : scene === "exam-released" ? "exam-released" : "";
  frame.src = "/app/t6.html" + (startupScenario ? "?scenario=" + startupScenario +
    (scene === "exam-question" || scene === "exam-final" || scene === "mini-question" || scene === "mini-feedback" || scene === "mini-result" ? "&course=" + encodeURIComponent(subject) : "") : "");
  document.body.appendChild(frame);

  /* ---- waiting -------------------------------------------------------------------
   * Poll rather than listen: the app exposes no ready event, and the things being
   * waited for arrive from three different mechanisms (boot render, a view transition,
   * a re-render after a click). A deadline in virtual time costs no wall clock. */
  function waitFor(describe, test, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var deadline = Date.now() + (timeoutMs || 6000);
      (function poll() {
        var value;
        try { value = test(); } catch (error) { value = null; }
        if (value) return resolve(value);
        if (Date.now() > deadline) return reject(new Error("timed out waiting for " + describe));
        setTimeout(poll, 40);
      })();
    });
  }

  function doc() { return frame.contentDocument; }
  function win() { return frame.contentWindow; }

  function card(code) {
    return Array.prototype.slice.call(doc().querySelectorAll("#course-grid .course-card"))
      .filter(function (button) {
        var label = button.querySelector(".course-code");
        return label && label.textContent.trim() === code;
      })[0];
  }

  function pick(selector) { return doc().querySelector(selector); }

  /* Advance one step of a learn run through the real controls: fill whatever the
     surface asks for, commit, continue. */
  function advance() {
    var d = doc();
    var textarea = d.querySelector("#options textarea");
    if (textarea) {
      textarea.value = "I think the rule is that the promise sets what the chain has to be good at.";
      textarea.dispatchEvent(new (win().Event)("input", { bubbles: true }));
    }
    var groups = {};
    Array.prototype.slice.call(d.querySelectorAll("#options input[type=radio]")).forEach(function (radio) {
      if (!groups[radio.name]) { groups[radio.name] = 1; radio.click(); }
    });
    var option = d.querySelector("#options .option");
    if (option && !Object.keys(groups).length) option.click();
    var confidence = d.getElementById("confidence-check");
    if (confidence && !confidence.hidden) {
      var choice = confidence.querySelector("input[type=radio], button");
      if (choice) choice.click();
    }
    var commit = d.getElementById("commit-answer");
    if (commit && !commit.hidden && !commit.disabled) commit.click();
    var next = d.getElementById("next-question");
    if (next && !next.hidden) next.click();
  }

  function answerMiniQuestion() {
    var d = doc();
    /* Matching uses a two-click pick/place interaction. Pair the first remaining
       tablet with the first empty slot until the response is complete. Correctness
       is irrelevant here; the scene is proving the coached flow reaches feedback. */
    var safety = 0;
    while (d.querySelector("#options .tray-items .label-tablet") && safety < 12) {
      var tablet = d.querySelector("#options .tray-items .label-tablet");
      var slot = d.querySelector("#options .match-slot:not(.filled)");
      if (!tablet || !slot) break;
      tablet.click(); slot.click(); safety += 1;
    }
    Array.prototype.slice.call(d.querySelectorAll("#options select")).forEach(function (select) {
      if (select.options.length) {
        select.selectedIndex = Math.min(1, select.options.length - 1);
        select.dispatchEvent(new (win().Event)("change", {bubbles:true}));
      }
    });
    Array.prototype.slice.call(d.querySelectorAll("#options input[type=number], #options input[type=text]")).forEach(function (input) {
      input.value = "0";
      input.dispatchEvent(new (win().Event)("input", {bubbles:true}));
    });
    var textarea = d.querySelector("#options textarea");
    if (textarea) {
      textarea.value = "The framework applies because the case evidence changes the decision, so the next action should follow that rule while checking the main trade-off.";
      textarea.dispatchEvent(new (win().Event)("input", {bubbles:true}));
    }
    var groups = {};
    Array.prototype.slice.call(d.querySelectorAll("#options input[type=radio]")).forEach(function (radio) {
      if (!groups[radio.name]) { groups[radio.name] = true; radio.click(); }
    });
    var checkbox = d.querySelector("#options input[type=checkbox]");
    if (checkbox) checkbox.click();
    var option = d.querySelector("#options .option");
    if (option && !Object.keys(groups).length && !checkbox) option.click();
    var commit = d.getElementById("commit-answer");
    if (!commit || commit.disabled || commit.hidden) throw new Error("mini-mock answer was not ready to check");
    commit.click();
  }

  function openMiniMock() {
    return SCENES["exam-home"]()
      .then(function () {
        var button = pick('[data-mini-mock-course="' + subject + '"]');
        if (!button) throw new Error("no Speedrun button for " + subject);
        button.click();
      })
      .then(function () {
        return waitFor("the Speedrun question", function () {
          return pick(".practice-screen.active #commit-answer") && pick(".practice-screen.active #confidence-guide");
        });
      });
  }

  /* Complete the eight-step coached round through its real answer and Continue
     controls. This is deliberately a browser flow rather than a result fixture: it
     proves that the time cap is not silently expanded by primers, lessons,
     confidence prompts or re-attempts, that every answer teaches immediately, and
     that the eighth Continue reaches the confidence-round result. */
  function completeMiniMock() {
    var answered = 0;
    function answerNext() {
      return waitFor("Speedrun question " + (answered + 1), function () {
        return pick(".practice-screen.active #commit-answer:not([hidden])");
      }).then(function () {
        answerMiniQuestion();
        return waitFor("teaching feedback for Speedrun question " + (answered + 1), function () {
          return pick(".practice-screen.active #feedback.visible .confidence-method-result");
        });
      }).then(function () {
        answered += 1;
        var next = pick("#next-question:not([hidden])");
        if (!next) throw new Error("Speedrun teaching feedback had no Continue action");
        next.click();
        if (answered < 8) return answerNext();
        return waitFor("the Speedrun result after exactly eight answers", function () {
          return pick(".results-screen.active") && pick("#results-title") &&
            /all eight modules/i.test(pick("#results-title").textContent) &&
            /next Speedrun|fresh rotation/i.test(pick("#result-primary").textContent);
        });
      });
    }
    return answerNext().then(function () {
      if (answered !== 8) throw new Error("Speedrun completed after " + answered + " answers instead of 8");
    });
  }

  /* ---- the scenes ---------------------------------------------------------------
   * Each reaches its screen through the controls a learner uses. A scene that cannot
   * find its control rejects, and the frame paints the failure rather than
   * photographing whatever happened to be on screen. */
  var SCENES = {
    /* The homepage on a fresh profile — what a learner meets first. */
    dashboard: function () {
      return waitFor("the dashboard and its one next action", function () {
        return card(subject) && pick(".dashboard-screen.active #start-recommended") &&
          pick(".dashboard-screen.active #next-step-title");
      });
    },

    "dashboard-folded": function () {
      return SCENES.dashboard()
        .then(function () {
          /* Screenshots accept the settled state, not a headless RAF implementation.
             The production fallback is the same immediate state used for reduced
             motion; the live browser separately exercises the GSAP transition. */
          win().gsap = null;
          card(subject).click();
        })
        .then(function () {
          return waitFor("the compact subject tabs with a named current subject", function () {
            return pick("#course-grid.is-folded .course-card[aria-current='true'] .course-current");
          });
        });
    },

    /* The first lesson of the subject's first step: the teaching surface. */
    lesson: function () {
      return SCENES.dashboard()
        .then(function () { win().gsap = null; card(subject).click(); })
        .then(function () {
          return waitFor("the selected subject and its one start action", function () {
            return pick("#course-grid.is-folded .course-card[aria-current='true']") && pick("#start-recommended");
          });
        })
        .then(function (button) { button.click(); })
        .then(function () {
          return waitFor("a lesson on screen", function () {
            var panel = doc().getElementById("lesson-panel");
            return panel && !panel.hidden;
          });
        });
    },

    /* A scored question inside a real run, reached by answering the ones before it. */
    question: function () {
      return SCENES.lesson().then(function () {
        var tries = 0;
        function onward() {
          var options = doc().getElementById("options");
          var hasControl = options && options.querySelector(".option, input[type=radio]");
          var isPrediction = options && options.querySelector("textarea");
          if (hasControl && !isPrediction && tries > 0) return Promise.resolve();
          if (tries > 10) return Promise.reject(new Error("no scored question reached in 10 steps"));
          tries += 1;
          advance();
          return waitFor("the next step", function () { return doc().getElementById("options"); }, 3000).then(onward);
        }
        return onward();
      });
    },

    /* The examiner's front door. Crossing runs through a view transition. */
    "exam-home": function () {
      if (pick(".exam-home-screen.active")) {
        return waitFor("the active examiner home and its paper cards", function () {
          return pick(".exam-home-screen.active") && pick("#exam-papers [data-exam-set]");
        });
      }
      return waitFor("the Exam switch", function () { return doc().getElementById("mode-exam"); })
        .then(function (button) {
          /* Headless virtual time can keep a view-transition update callback pending
             forever because there is no displayed old frame to snapshot. Navigation
             is the contract under test here; the transition is decoration and has a
             synchronous production fallback, so exercise that fallback explicitly. */
          try { win().document.startViewTransition = null; } catch (error) { /* read-only engine */ }
          button.click();
        })
        .then(function () {
          return waitFor("the active examiner home and its paper cards", function () {
            return pick(".exam-home-screen.active") && pick("#exam-papers [data-exam-set]");
          });
        });
    },

    "exam-final": function () {
      return waitFor("the requested final 25 desk and all eight questions", function () {
        return pick(".exam-home-screen.active") && !pick("#exam-mode-final").hidden &&
          pick('[data-final-course="' + subject + '"][aria-selected="true"]') &&
          String(pick("#final-sprint .final-hero .eyebrow").textContent || "").indexOf(subject) === 0 &&
          doc().querySelectorAll(".final-route-step").length === 8;
        });
    },

    "exam-full": function () {
      return waitFor("the full-paper chooser", function () {
        return pick(".exam-home-screen.active") && !pick("#exam-mode-full").hidden &&
          pick("#exam-mode-full [data-exam-set]");
        });
    },

    "exam-released": function () {
      return waitFor("the released IBM briefing", function () {
        return pick(".exam-screen.active #exam-brief:not([hidden])") &&
          /Released case/i.test(pick("#exam-facts").textContent);
        });
    },

    "mini-question": function () {
      return waitFor("the Speedrun question", function () {
        return pick(".practice-screen.active #commit-answer") && pick(".practice-screen.active #confidence-guide");
      });
    },

    "mini-feedback": function () {
      return waitFor("immediate Speedrun teaching feedback", function () {
        return pick(".practice-screen.active #feedback.visible") && pick(".confidence-method-result");
        }).then(function () {
          var target = pick("#feedback");
          var top = target.getBoundingClientRect().top + win().scrollY - 90;
          doc().documentElement.style.scrollBehavior = "auto";
          win().scrollTo(0, Math.max(0, top));
          doc().documentElement.scrollTop = Math.max(0, top);
          doc().body.scrollTop = Math.max(0, top);
          return new Promise(function (resolve) { setTimeout(resolve, 240); });
        });
    },

    "mini-result": function () {
      return waitFor("the Speedrun question", function () {
        return pick(".practice-screen.active #commit-answer") && pick(".practice-screen.active #confidence-guide");
      }).then(completeMiniMock);
    },

    notes: function () {
      return waitFor("Quick Notes and its first complete chapter", function () {
        return pick(".notes-screen.active #notes-reader .notes-lesson") &&
          pick(".notes-screen.active #notes-module-nav button");
      });
    },

    "notes-ibm": function () {
      return SCENES.notes()
        .then(function () { pick('[data-notes-course="IBM"]').click(); })
        .then(function () {
          return waitFor("the IBM released-case notes pack", function () {
            return pick(".notes-screen.active .notes-case-pack [data-open-released-case]");
          });
        });
    },

    /* A paper mid-question: the screen the 2026-08-14 layout sweep never visited, and
       where the legend chip was found painting across its own label (LAW-64). */
    "exam-question": function () {
      return waitFor("a live question on the requested paper", function () {
        return pick(".exam-screen.active #exam-runner:not([hidden]) .exam-stem");
      });
    }
  };

  frame.addEventListener("load", function () {
    if (!SCENES[scene]) {
      return fail("unknown scene; have: " + Object.keys(SCENES).join(", "));
    }
    if (theme === "dark" || theme === "light") {
      try {
        if (win().T6Theme && typeof win().T6Theme.set === "function") win().T6Theme.set(theme);
      } catch (error) { /* the app decides; the frame's ground colour still matches */ }
    }
    SCENES[scene]()
      .then(function () {
        /* Settle before the shutter.
         *
         * A shot taken mid-transition photographs a frame no learner sees for longer
         * than 200ms. The first version finished every animation once and waited
         * 120ms, and the mobile dashboard still came back with the resume bar's
         * "Start this study set / Go →" ghosted underneath the real button — the bar
         * renders and then hides itself when it finds no run to resume, and the
         * shutter landed inside that. Finishing once is not enough: finishing one
         * animation can start another (`allow-discrete` + `@starting-style` is exactly
         * that shape), so this finishes repeatedly until two consecutive checks find
         * nothing running. */
        function quiet(rounds) {
          var d = doc();
          if (typeof d.getAnimations !== "function") {
            return new Promise(function (resolve) { setTimeout(resolve, 250); });
          }
          var live = d.getAnimations().filter(function (animation) { return animation.playState === "running"; });
          live.forEach(function (animation) {
            try { animation.finish(); } catch (error) { /* infinite ones cannot finish */ }
          });
          if (!live.length && rounds >= 2) {
            return new Promise(function (resolve) { setTimeout(resolve, 250); });
          }
          if (rounds > 40) throw new Error("the page never stopped animating");
          return new Promise(function (resolve) { setTimeout(resolve, 60); })
            .then(function () { return quiet(live.length ? 0 : rounds + 1); });
        }
        return quiet(0);
      })
      /* `&optical=1` draws the gridlines over the settled scene before the shutter, so
         the shot is of the page *and* the lines its ink does or does not sit on. Runs
         last, after `quiet()`, because the probe measures rendered ink and a scene that
         is still animating has none of its final positions yet. A failure here is
         reported rather than swallowed: a gridline shot that quietly came back without
         gridlines would look exactly like a page with nothing to report. */
      .then(function () {
        if (params.get("audit") !== "1") return null;
        return fetch("/tools/browser-checks/ui-audit.js")
          .then(function (r) { return r.text(); })
          .then(function (src) {
            var report = document.createElement("pre");
            report.id = "ui-audit-report";
            report.hidden = true;
            report.textContent = JSON.stringify(win().eval(src));
            document.body.appendChild(report);
          });
      })
      .then(function () {
        if (params.get("optical") !== "1") return null;
        return fetch("/tools/browser-checks/optical-audit.js")
          .then(function (r) { return r.text(); })
          .then(function (src) {
            var w = win();
            var result = w.eval(src);
            var report = document.createElement("pre");
            report.id = "optical-audit-report";
            report.hidden = true;
            report.textContent = JSON.stringify(result);
            document.body.appendChild(report);
            if (!w.optical || typeof w.optical.overlay !== "function") throw new Error("optical.overlay was not installed");
            var drew = w.optical.overlay();
            if (!/\d+ gridlines/.test(String(drew))) throw new Error("overlay drew nothing: " + drew);
            return new Promise(function (resolve) { setTimeout(function () { resolve(result); }, 120); });
          });
      })
      .then(function () { document.title = "shot ready: " + scene; })
      .catch(function (error) { fail(String((error && error.stack) || error)); });
  });
})();
</script>
</body>
</html>
